# Every column of gld_player_signals_daily and how it is checked (02_validation.ipynb, part A).
# Written by the generator in the session; edit by hand from now on.
#
# kind:
#   formula    the equation of the workbook (gld-schemas.xlsx), on the other columns of the same row
#   identity   an accounting relation between columns (hypothesis when the workbook has no formula)
#   window     the 7- or 30-day value is the sum of the daily value (base) of the table over those days
#   lag        a prior_* column is the value of `source` lag_days before
#   bound      `expr` must be true (impossible values and order between windows); rows where it is NULL are left out
#   band       the band against its score (with `cutoffs` when the workbook gives them)
#   validated  checked against the daily tables in notebook 08
#   format     the text of an id or a code follows its format (`expr` true), 06_extra_checks.ipynb
#   distribution  a categorical column is not uniform over its values; checked by eye on its figure
#   share      an amount is a share of another one (`expr` true), 06_extra_checks.ipynb
#   none       key, text, metadata or not checkable here
# expr is DuckDB SQL on the columns of the table. Production names differ from the workbook:
# recency_score = recency_pressure, frequency_score = frequency_decline, monetary_score = value_decline,
# deposit_velocity = rg_deposit_velocity, rg_risk_score = risk_score, night_index = rg_night_play_ratio.

table: gld_player_signals_daily
snapshots:
- '2026-09-15'
- '2026-10-01'
brands:
- 14
- 23
- 64
- 72
- 73
tolerance:
  atol: 0.01
  rtol: 0.001
verdict:
  good: 0.99
  fair: 0.95
notebook_08: The columns of kind `validated` and the window columns also checked against the daily tables in eda/08_signal_validation.ipynb

columns:
  tenant_id:
  - kind: format
    expr: regexp_full_match(tenant_id, '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
    note: A UUID in lower case
  player_id:
  - kind: format
    expr: regexp_full_match(CAST(player_id AS VARCHAR), '[0-9]{5,8}')
    note: Digits only, 5 to 8 of them
  snapshot_date:
  - kind: none
    note: Not checkable with the lake files
  currency:
  - kind: format
    expr: currency <> '' AND currency = upper(currency)
    note: A currency code in upper case, never empty
  country:
  - kind: format
    expr: country <> '' AND country = upper(country)
    note: A country code in upper case, never empty
  language:
  - kind: format
    expr: language <> '' AND language = lower(language)
    note: A language code, never empty
  param_version:
  - kind: none
    note: Key, text or metadata
  _version:
  - kind: none
    note: Key, text or metadata
  _ingested_at:
  - kind: none
    note: Not checkable with the lake files
  _processed_at:
  - kind: none
    note: Not checkable with the lake files
  brand_id:
  - kind: none
    note: Null in all rows until 2026-07-05 and in 31% after (audit 1); the brand comes from the activity
  wagered_eur_l7d:
  - kind: window
    base: wagered_eur_today
    days: 7
    note: Sum of wagered_eur_today over the 7 days up to the date
  - kind: bound
    expr: wagered_eur_l7d >= wagered_eur_today
    note: A longer window cannot be smaller (today to l7d)
  wagered_eur_l30d:
  - kind: window
    base: wagered_eur_today
    days: 30
    note: Sum of wagered_eur_today over the 30 days up to the date
  - kind: bound
    expr: wagered_eur_l30d >= wagered_eur_l7d
    note: A longer window cannot be smaller (l7d to l30d)
  - kind: identity
    expr: wagered_real_eur_l30d + wagered_bonus_eur_l30d
    note: Stake = real-money stake + bonus stake
  wagered_eur_l90d:
  - kind: bound
    expr: wagered_eur_l90d >= wagered_eur_l30d
    note: A longer window cannot be smaller (l30d to l90d)
  wagered_eur_l180d:
  - kind: bound
    expr: wagered_eur_l180d >= wagered_eur_l90d
    note: A longer window cannot be smaller (l90d to l180d)
  wagered_eur_today:
  - kind: bound
    expr: wagered_eur_today >= 0
    note: Cannot be negative
  - kind: identity
    expr: wagered_real_eur_today + wagered_bonus_eur_today
