  hold_pct_l30d:
  - kind: identity
    expr: CASE WHEN wagered_eur_l30d > 0 THEN 100 * ggr_eur_l30d / wagered_eur_l30d END
    note: GGR / stake in percent
  - kind: bound
    expr: hold_pct_l30d <= 100
    note: GGR cannot exceed the stake
  theo_win_eur_l30d:
  - kind: bound
    expr: theo_win_eur_l30d >= 0 AND theo_win_eur_l30d <= wagered_eur_l30d
    note: 'Expected GGR: between 0 and the stake'
  value_score_eur:
  - kind: formula
    measure: M130
    expr: greatest(0, ggr_eur_l7d + 0.70 * (ggr_eur_l30d - ggr_eur_l7d) + 0.40 * (ggr_eur_l90d - ggr_eur_l30d) + 0.20 * (ggr_eur_l180d - ggr_eur_l90d))
    note: max(0, 1.00*ggr[0-7d] + 0.70*ggr[8-30d] + 0.40*ggr[31-90d] + 0.20*ggr[91-180d]), value.decay_weights = [1.0, 0.7, 0.4, 0.2]
  value_tier:
  - kind: band
    score: value_score_eur
    note: Tier against the value score (no cutoffs in the workbook)
  - kind: distribution
    note: Not uniform; its levels fall from the lowest to the highest
  lifetime_value_tier:
  - kind: distribution
    note: Not uniform; its levels fall from the lowest to the highest
  value_rank_within_tenant:
  - kind: bound
    expr: value_rank_within_tenant >= 1
    note: A rank starts at 1
  prev_value_tier:
  - kind: distribution
    note: Not uniform; its levels fall from the lowest to the highest
  value_tier_changed_at:
  - kind: bound
    expr: value_tier_changed_at <= snapshot_date
    note: A change cannot be after the date
  churn_band_changed_at:
  - kind: bound
    expr: churn_band_changed_at <= snapshot_date
    note: A change cannot be after the date
  risk_band_changed_at:
  - kind: bound
    expr: risk_band_changed_at <= snapshot_date
    note: A change cannot be after the date
  lifecycle_stage_changed_at:
  - kind: bound
    expr: lifecycle_stage_changed_at <= snapshot_date
    note: A change cannot be after the date
  prev_churn_band:
  - kind: distribution
    note: Not uniform over its values
  prev_risk_band:
  - kind: distribution
    note: Not uniform; its levels fall from the lowest to the highest
  prev_lifecycle_stage:
  - kind: distribution
    note: Not uniform over its values
  engagement_score:
  - kind: formula
    measure: M116
    expr: least(100, greatest(0, 0.4 * (active_days_l30d / 30.0) * 100 + 0.3 * least(1, sessions_l30d / 60.0) * 100 + 0.3 * least(1, play_secs_l30d / 108000.0) * 100))
    note: clamp(0,100, w1*(active_days[30d]/30)*100 + w2*min(1, sessions[30d]/60)*100 + w3*min(1, play_secs[30d]/108000)*100), engagement.weights = [0.4, 0.3, 0.3]
  prior_engagement_score:
  - kind: lag
    source: engagement_score
    lag_days: 7
    note: The score of 7 days before (lag assumed)
  games_breadth_l30d:
  - kind: bound
    expr: games_breadth_l30d >= 0
    note: Cannot be negative
  sessions_with_bonus_l30d:
  - kind: bound
    expr: sessions_with_bonus_l30d <= sessions_l30d
    note: A part of the sessions
  tp_night_index:
  - kind: bound
    expr: tp_night_index BETWEEN 0 AND 1
    note: Unit 0-1 in the workbook
  tp_weekend_index:
  - kind: bound
    expr: tp_weekend_index BETWEEN 0 AND 1
    note: Unit 0-1 in the workbook
  tp_business_hours_ratio:
  - kind: bound
    expr: tp_business_hours_ratio BETWEEN 0 AND 1
    note: Unit 0-1 in the workbook
  tp_hourly_entropy:
  - kind: bound
    expr: tp_hourly_entropy BETWEEN 0 AND 1
    note: Unit 0-1 in the workbook
  top_peak_hour:
  - kind: bound
    expr: top_peak_hour BETWEEN 0 AND 23
    note: An hour of the day
  top_peak_day:
  - kind: bound
    expr: top_peak_day BETWEEN 0 AND 7
    note: A day of the week
  tp_avg_session_duration_secs:
  - kind: bound
    expr: CASE WHEN tp_avg_session_duration_secs > 0 THEN tp_avg_session_duration_secs BETWEEN 10 AND 14400 END
    note: 'Recomputed in audit 2: sessions of 10 s to 4 h (session timeout not in the workbook). 0 means no time-of-play data and is left out'
  tp_median_session_duration_secs:
  - kind: bound
    expr: CASE WHEN tp_median_session_duration_secs > 0 THEN tp_median_session_duration_secs BETWEEN 10 AND 14400 END
    note: 'Same range as the mean. 0 means no data and is left out'
  tp_avg_sessions_per_active_day:
  - kind: bound
    expr: tp_avg_sessions_per_active_day >= 1 OR tp_avg_sessions_per_active_day = 0
    note: At least one session on an active day
  tp_avg_session_gap_hours:
  - kind: bound
    expr: tp_avg_session_gap_hours >= 0
    note: Cannot be negative
  tp_max_sessions_single_day:
  - kind: bound
    expr: tp_max_sessions_single_day >= 0
    note: Cannot be negative
  tp_window_days:
  - kind: none
    note: Window of the time-of-play signals
  rg_night_play_ratio:
  - kind: identity
    expr: tp_night_index
    note: Same concept as tp_night_index (Signal Audit sheet)
  - kind: bound
    expr: rg_night_play_ratio BETWEEN 0 AND 1
    note: A share
  stake_escalation:
  - kind: formula
    measure: M140
    expr: CASE WHEN avg_bet_eur_l30d > 0 THEN (avg_bet_eur_l7d - avg_bet_eur_l30d) / avg_bet_eur_l30d ELSE 0 END
    note: (avg_bet_eur[7d] - avg_bet_eur[30d]) / avg_bet_eur[30d], else 0
  bet_z_score:
  - kind: formula
    measure: M139
    tenant_z: avg_bet_eur_l30d
    note: (avg_bet_eur[30d] - tenant_avg_bet) / tenant_stddev_bet, else 0. Tenant mean and deviation taken over the brand's players with a stake that day (approximation)
  session_len_z:
  - kind: formula
    measure: M136
    tenant_z: tp_avg_session_duration_secs
    note: (avg_session_secs - tenant_avg_session) / tenant_stddev_session, else 0 (same approximation)
  risk_appetite_score:
  - kind: formula
    measure: M134
    expr: least(100, greatest(0, 50 + 50 * least(1, greatest(-1, bet_z_score))))
    note: clamp(0,100, 50 + 50*clamp(bet_z_score,-1,1))
  betting_aggression_score:
  - kind: formula
    measure: M143
    expr: least(100, greatest(0, 50 + 25 * least(2, greatest(-2, bet_z_score)) + 25 * least(1, greatest(-1, stake_escalation))))
    note: clamp(0,100, 50 + 25*clamp(bet_z_score,-2,2) + 25*clamp(stake_escalation,-1,1))
  prior_betting_aggression_score:
  - kind: lag
    source: betting_aggression_score
    lag_days: 7
    note: The score of 7 days before (lag assumed)
  deposit_frequency_score:
  - kind: formula
    measure: M112
    expr: CASE WHEN deposits_eur_l30d > 0 THEN least(100, greatest(0, 50 + 50 * least(1, greatest(-1, (deposits_eur_l7d / 7) / (deposits_eur_l30d / 30) - 1)))) ELSE 0 END
    note: 'if deposits_eur[30d] > 0: clamp(0,100, 50 + 50*clamp((deposits[7d]/7)/(deposits[30d]/30) - 1, -1, 1)) else 0'
  deposit_recency_score:
  - kind: formula
    measure: M113
    expr: CASE WHEN deposits_eur_today > 0 THEN 100 ELSE 100 * (1 - least(1, days_since_bet / 30.0)) END
    note: if deposits_eur[today] > 0 then 100 else 100*(1 - min(1, days_since_bet/30)). Uses days since the last BET (likely an error of the definition)
  rg_loss_chasing_30d:
  - kind: formula
    measure: M122
    expr: CASE WHEN wagered_eur_l30d > 0 AND ggr_eur_l30d < 0 THEN least(1, -ggr_eur_l30d / wagered_eur_l30d) ELSE 0 END
    note: 'if wagered_eur[30d] > 0 AND ggr_eur[30d] < 0: min(1, -ggr_eur[30d] / wagered_eur[30d]) else 0'
  rg_deposit_velocity:
  - kind: formula
    measure: M115
    expr: CASE WHEN deposits_eur_l30d > 0 THEN deposits_eur_l7d / (deposits_eur_l30d / 30 * 7) ELSE 0 END
    note: deposits_eur[7d] / (deposits_eur[30d]/30 * 7); 0 when there is no deposit (assumed)
  net_loss_velocity:
  - kind: formula
    measure: M126
    expr: CASE WHEN deposits_eur_l30d > 0 THEN greatest(0, -ggr_eur_today) / (deposits_eur_l30d / 30 + 1) ELSE 0 END
    note: 'if deposits_eur[30d] > 0: max(0, -ggr_eur[today]) / (deposits_eur[30d]/30 + 1) else 0'
  session_intensity_score:
  - kind: formula
    measure: M135
    expr: CASE WHEN active_days_l30d > 0 THEN least(100, 100 * play_secs_today / (play_secs_l30d / active_days_l30d + 1)) END
    note: min(100, 100 * play_secs[today] / (play_secs[30d]/active_days[30d] + 1))
  risk_score:
  - kind: formula
    measure: M133
    expr: least(100, greatest(0, 20 * least(rg_loss_chasing_30d, 1) + 20 * least(rg_deposit_velocity, 1) + 15 * rg_night_play_ratio + 20 * least(1, greatest(0, stake_escalation)) + 25 * least(net_loss_velocity
      / 100, 1)))
    note: 'rg_risk_score: clamp(0,100, 20*min(loss_chasing,1) + 20*min(deposit_velocity,1) + 15*night_index + 20*clamp(stake_escalation,0,1) + 25*min(net_loss_velocity/100,1))'
  risk_band:
  - kind: band
    score: risk_score
    cutoffs:
    - 25
    - 50
    - 75
    note: risk.band_cutoffs = [25, 50, 75]
  - kind: distribution
    note: Not uniform; its levels fall from the lowest to the highest
  prior_risk_score:
  - kind: lag
    source: risk_score
    lag_days: 7
    note: The score of 7 days before (lag assumed)
  frequency_decline:
  - kind: formula
    measure: M117
    expr: CASE WHEN active_days_l30d > 0 THEN 100 * greatest(0, 1 - (active_days_l7d / 7.0) / (active_days_l30d / 30.0)) END
    note: 'frequency_score: 100 * max(0, 1 - (active_days[7d]/7) / (active_days[30d]/30)), churn component F'
  value_decline:
  - kind: formula
    measure: M125
    expr: CASE WHEN ggr_eur_l90d <> 0 THEN 100 * greatest(0, 1 - (ggr_eur_l7d / 7) / (ggr_eur_l90d / 90)) END
    note: 'monetary_score: 100 * max(0, 1 - (ggr_eur[7d]/7) / (ggr_eur[90d]/90)), churn component M'
  recency_pressure:
  - kind: bound
    expr: recency_pressure <= least(100, 100 * days_since_bet / 3.0) + 0.01
    note: 'recency_score: min(100, 100 * days_since_bet / max(typical_gap_days, 3)). The typical gap is not stored, so only its upper bound (gap floor 3 days) can be checked'
  churn_score:
  - kind: formula
    measure: M107
    expr: least(100, greatest(0, 0.50 * recency_pressure + 0.30 * frequency_decline + 0.20 * value_decline))
    note: clamp(0,100, 0.50*recency + 0.30*frequency + 0.20*monetary), churn.weights = [0.5, 0.3, 0.2]
  churn_propensity_raw:
  - kind: formula
    measure: M108
    expr: least(1, days_since_bet / 90.0)
    note: min(1, days_since_bet / 90)
  churn_band:
  - kind: band
    score: churn_score
    cutoffs:
    - 25
    - 50
    - 75
    note: churn.band_cutoffs = [25, 50, 75]
  - kind: distribution
    note: Not uniform over its values
  prior_churn_score:
  - kind: lag
    source: churn_score
    lag_days: 7
    note: The score of 7 days before (lag assumed)
  has_sufficient_data:
  - kind: none
    note: sufficiency.min_bets = 3 and min_tenure_days = 14, but the window of the bets is not defined
  confidence_score:
  - kind: bound
    expr: confidence_score BETWEEN 0 AND 1
    note: Unit 0-1
  gap_days:
  - kind: bound
    expr: gap_days >= 0
    note: Days of missing data in the window
  lifecycle_stage:
  - kind: distribution
    note: Not uniform over its values
  tenure_days:
  - kind: validated
    note: 'Notebook 08: wrong in the backfilled history (fails until 2026-07)'
  days_since_bet:
  - kind: validated
    note: 'Notebook 08: 0 until 2026-07, then built with data of 7 days later'
  - kind: bound
    expr: days_since_bet <= tenure_days
    note: Cannot exceed the tenure
  current_active_streak_days:
  - kind: bound
    expr: current_active_streak_days <= tenure_days + 1
    note: Cannot exceed the tenure
