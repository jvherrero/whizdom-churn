# What each column of the master catalog is and how it is made. master.ipynb writes it as the sheet "columns".
#   meaning: what the column is.   how: the operation, step by step.   origin: the columns or fields it comes from.
#   source: only to override the default source (the default comes from the prefix of the column).
# The columns of a source (ref_, ca_, sa_, ge_, sc_) get their source, origin and how from the prefix (master_lib.py).
# Here they only need a meaning. If a source column has no meaning here or in columns.yaml, the sheet says so.

# ---- made in master.ipynb ----
whizdom_game_id:
  meaning: "Our own ID of the game. The same game and provider always give the same ID, whatever platform or brand sells it"
  origin: "game_name, provider"
  how: "uuid5(NAMESPACE, '<provider>/<game slug>'). The game slug is the name in lower case, without accents, symbols or apostrophes, with the words joined by one hyphen (Gates of Olympus 1000 gives gates-of-olympus-1000). NAMESPACE is a constant in master_lib.py. A game with no name gets no ID"
game_name:
  meaning: "Name of the game"
  origin: "ref_game_name, ca_game_name, sa_game_name, ge_game_name, explicit_names (config.yaml)"
  how: "The first of these that is not empty, in this order. If none has a name, the name written in explicit_names of config.yaml for provider_code/game_id (only sports betting). Then a lone S that ref_games wrote for an apostrophe is put back (Santa S Gifts becomes Santa's Gifts). The source is in name_source"
name_source:
  meaning: "Where game_name comes from"
  origin: "ref_game_name, ca_game_name, sa_game_name, ge_game_name, explicit_names (config.yaml)"
  how: "ref_games, client_area, slotcatalog_file, games_enriched, or explicit (a name written on purpose in config.yaml)"
ggr_eur_6m:
  source: "ClickHouse slv_game_daily (file output/active_games.csv)"
  meaning: "GGR of the last 6 months in EUR. The catalog is ordered by it"
  origin: "slv_game_daily: wagered_* and won_* columns, in EUR"
  how: "GGR = wagered minus won, where wagered is wagered_real_eur + wagered_released_bonus_eur + wagered_playable_bonus_eur and won is the same three columns of won. Summed from 6 months ago to yesterday, by platform and game_id (lower case, letters and digits only), then sent to game_uid with slv_games_discovered_resolved. active_games.py keeps the games with positive GGR, from the highest, until they hold 99% of the positive GGR; the file is the frozen list of 2026-10-28. Here: the sum of all the game_uid of the ID. Empty if the game is not in that list. The query is in the sheet sources"
rounds_6m:
  source: "ClickHouse slv_game_daily (file output/active_games.csv)"
  meaning: "Rounds played in the last 6 months. Second key of the order of the catalog"
  origin: "slv_game_daily: rounds"
  how: "Sum of rounds over the same days, platforms and games as ggr_eur_6m. Here: the sum of all the game_uid of the ID. Empty if the game is not in the list"
provider:
  meaning: "Standard provider (the studio) as a slug"
  origin: "studio, providers.yaml"
  how: "The studio is turned into a slug (lower case, no accents or symbols) and looked up in providers.yaml, which maps every spelling to one standard name (Pragmatic Live Casino gives pragmatic-play). A studio that is not in the dictionary keeps its own slug. If studio_source is same_name, the provider is the one of the other game with the same name"
provider_id:
  meaning: "Our own ID of the provider. One per standard provider"
  origin: "provider"
  how: "uuid5(NAMESPACE, '<provider>'), with the same NAMESPACE as whizdom_game_id"
id_version:
  meaning: "Version of the rules that make the IDs"
  origin: "ID_VERSION in master_lib.py"
  how: "A constant. It changes only if slugify or the way of making the ID changes on purpose"
studio:
  meaning: "Studio that made the game, as the source writes it. provider has it in standard form"
  origin: "ref_studios, ca_provider, sc_provider, ref_provider_name"
  how: "The first of these that is not empty, in this order. sc_provider is the provider of the JSON found by the UUID of the SA file. The last one is the platform. Then a game takes the studio of another game with the same name and the same RTP from a better source (order: ref_games, Client Area, JSON, platform). That is same_name: it joins, for example, the distributor ORYX with the studio Gamomat"
studio_source:
  meaning: "Where studio comes from"
  origin: "ref_studios, ca_provider, sc_provider, ref_provider_name"
  how: "ref_games (studios), client_area (Provider), slotcatalog_json, platform (no studio is known, the platform is used), or same_name (taken from another game with the same name and RTP)"
status:
  meaning: "Commercial status of the game (released, disabled, review, upcoming)"
  origin: "ref_status, ca_status"
  how: "ref_status; if empty, the Status of the Client Area"
game_type:
  meaning: "Type of game (Slots, Blackjack, Roulette...)"
  origin: "ref_game_type, ca_game_type"
  how: "ref_game_type; if empty, the Game type of the Client Area"
is_sports:
  meaning: "true if the game is sports betting. It has no Slot Catalog page"
  origin: "ref_provider_code, sports_provider_codes of config.yaml"
  how: "true if the platform code is in the list sports_provider_codes (BETTECH, DIGITAIN_SPORTBOOK)"
rtp:
  meaning: "RTP (number, in percent)"
  origin: "ref_rtp, ca_rtp"
  how: "ref_rtp; if empty, the RTP of the Client Area, converted to a number. sc_rtp is the one of Slot Catalog"
url:
  meaning: "Slot Catalog page of the game (click to open)"
  origin: "sa_sc_url, source_url of the raw JSON, ca_external_resource"
  how: "The first of these that is not empty, in this order. The Client Area External Resource is used only if it contains slotcatalog. The source is in url_source"
url_source:
  meaning: "Where url comes from"
  origin: "sa_sc_url, source_url of the raw JSON, ca_external_resource"
  how: "slotcatalog_file, raw_json, client_area, or none"
match_status:
  meaning: "How sure is the link of the game with a Slot Catalog page and its sc_ data"
  origin: "whizdom_game_id, sa_game_id, raw JSON"
  how: "The JSON found by name + provider is compared with the one found by the platform ids (UUID of the SA file). exact: the JSON found by ids has the same whizdom_game_id as the game. review: only one way finds a JSON, they disagree, or only a close name exists. no_match: nothing is found"
close_name:
  meaning: "A name of the same provider in the raw JSON that is very close to the game"
  origin: "game_slug, provider, names of the raw JSON"
  how: "Only for games with no JSON found. difflib.get_close_matches with similarity 0.9 or more, among the JSON of the same provider, never the same name"
missing_data:
  meaning: "Key fields that are empty"
  origin: "game_name, studio_source, game_type"
  how: "A list: name (no name), studio (studio_source is platform or none, so the real studio is not known), game_type (empty)"
no_url:
  meaning: "true if the game has no Slot Catalog URL"
  origin: "url"
  how: "true when url is empty"
provider_check:
  meaning: "true if the provider has a look-alike name that is not merged in providers.yaml yet. A person decides"
  origin: "provider, names of all the sources"
  how: "Provider names are compared without words like gaming, casino, live or studios and without hyphens. If two names give the same core but are two standard providers, both are marked"
id_shared:
  meaning: "true if more than one game_uid of ref_games has this ID, usually the same game on two platforms"
  origin: "whizdom_game_id, ref_game_uid"
  how: "Count of game_uid by whizdom_game_id over the whole base list, greater than 1"
same_platform_conflict:
  meaning: "true if two game_uid of the same platform have this ID. So far they are the same game with two ids and the same RTP, shown as one row"
  origin: "whizdom_game_id, ref_provider_code"
  how: "true if the pair (whizdom_game_id, platform code) is repeated"
platforms:
  meaning: "Platforms that sell the game"
  origin: "ref_provider_code"
  how: "The platform codes of all the game_uid of the ID, without repeats, sorted and joined with a comma"
platform_rows:
  meaning: "How many game_uid of ref_games have this ID. The catalog shows only the best one"
  origin: "ref_game_uid"
  how: "Count of game_uid by whizdom_game_id. The row shown is the one with the best match_status (exact, review, no_match) and, if equal, the one with a URL"

# ---- columns of ref_games (ClickHouse). Copied as they are ----
ref_provider_code:
  meaning: "Code of the platform that sells the game (ISOFTBET, EVO_CAS...). It is not the studio"
ref_studios:
  meaning: "Studio that made the game, as ref_games has it. Often empty"
ref_vertical:
  meaning: "Group of the game (Slots, Table Games, Instant Win, Live Casino, Poker...)"
ref_theme:
  meaning: "Themes of the game in ref_games"
ref_volatility_class:
  meaning: "Volatility in ref_games (low, low - medium, medium, medium - high, high, very high). Often empty"
ref_jackpot:
  meaning: "Jackpot type in ref_games (no, yes, yes fixed...). Often empty"
ref_has_buy_bonus:
  meaning: "1 if the game has a buy bonus, 0 if not"
ref_has_freespins:
  meaning: "1 if the game has free spins, 0 if not"
ref_min_bet:
  meaning: "Minimum bet in ref_games (decimal)"
ref_max_bet:
  meaning: "Maximum bet in ref_games (decimal)"
ref_release_date:
  meaning: "Release date in ref_games. 2022-01-01 is a placeholder, not a real date: many games share it"
ref_first_seen:
  meaning: "First day the game was seen in the data. 2025-04-01 is the first day of the data: it only means 'seen since the start'"
ref_last_seen:
  meaning: "Last day the game was seen in the data. The base list of the master keeps the games seen since master_seen_since (config.yaml)"
ref_enrichment_status:
  meaning: "State of the game in the pipeline of ref_games: enriched, catalogued or discovered. It is not the classification of SA"
ref_in_cms:
  meaning: "0 or 1 flag of ref_games. By its name, the game is in the CMS. There is no definition in the repository"
ref_in_transactions:
  meaning: "0 or 1 flag of ref_games. By its name, the game has transactions. There is no definition in the repository"
ref_in_client_area:
  meaning: "0 or 1 flag of ref_games. By its name, the game is in the Client Area. There is no definition in the repository"
ref_total_txn_count:
  meaning: "Number of transactions of the game, by its name. There is no definition in the repository"
ref_n_brands:
  meaning: "Number of brands that have the game, by its name. There is no definition in the repository"
ref__version:
  meaning: "Technical: version of the row in ClickHouse (ref_games is read with FINAL, so only the last version is here). It is not data of the game"
ref__ingested_at:
  meaning: "Technical: when ClickHouse loaded the row. It is not data of the game"

# ---- columns of the Slot Catalog URL file of SA ----
sa_sc_url:
  meaning: "Slot Catalog page of the game, in the SA file. The first source of url"
sa_game_name:
  meaning: "Name of the game in the SA file. The name of the raw JSON comes from here, because the page title has extra text"
sa_provider:
  meaning: "Studio of the game in the SA file"
sa_platform:
  meaning: "Platform code in the SA file. With the game id, it joins the file to ref_games"

# ---- columns of the raw Slot Catalog JSON that are not a field of raw_data ----
sc_extracted_at:
  origin: "extraction_timestamp of the JSON file"
  how: "The date (without the hour) when the Slot Catalog page was read, written in the JSON by the extraction of SA. Not a field of raw_data"
  meaning: "Date when the Slot Catalog page of the game was read"
