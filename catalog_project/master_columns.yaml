# What each column of the master catalog is and how it is made. master.ipynb writes it as the sheet "columns".
#   meaning: what the column is.   how: the operation, step by step.   origin: the columns or fields it comes from.
#   source: only to override the default source (the default comes from the prefix of the column).
# The columns of a source (ref_, ca_, scu_, ge_, sc_, gm_) get their source, origin and how from the prefix (master_lib.py).
# Here they only need a meaning. If a source column has no meaning here or in columns.yaml, the sheet says so.
# These texts go to the Excel: never the name of a person or of a local file (master_lib.forbidden_cells checks it).

# ---- made in master.ipynb ----
whizdom_game_id:
  meaning: "Our own ID of the game. The same game and provider always give the same ID, whatever platform or brand sells it"
  origin: "game_name, provider"
  how: "uuid5(NAMESPACE, '<provider>/<game slug>'). The game slug is the name in lower case, without accents, symbols or apostrophes, with the words joined by one hyphen (Gates of Olympus 1000 gives gates-of-olympus-1000). NAMESPACE is a fixed UUID (907a5265-b739-542f-8906-b9b0c91432a8) that never changes. If one name and provider are two games (column variant of master_catalog_full.xlsx), the variant is added: '<provider>/<game slug>/rtp-94'. A game with no name gets no ID"
game_name:
  meaning: "Name of the game"
  origin: "ref_game_name, ca_game_name, scu_game_name, ge_game_name, names written by hand"
  how: "The first of these that is not empty, in this order. If none has a name, a name written by hand for that platform code and game id (only sports betting, see the sheet sources). If ref_games gives one name to two game_uid of the same provider that have two different names in the Client Area, each takes its Client Area name (Lady Wolf Moon and Lady Wolf Moon Megaways). Then a lone S that ref_games wrote for an apostrophe is put back (Santa S Gifts becomes Santa's Gifts). The source is in the column name_source of master_catalog_full.xlsx"
name_source:
  meaning: "Where game_name comes from"
  origin: "ref_game_name, ca_game_name, scu_game_name, ge_game_name, names written by hand"
  how: "ref_games, client_area, slotcatalog_file (the Slot Catalog URL file), games_enriched, or explicit (a name written by hand)"
ggr_eur_6m:
  source: "ClickHouse slv_game_daily (the 99% list of 2026-10-28)"
  meaning: "GGR of the last 6 months in EUR. The catalog is ordered by it"
  origin: "slv_game_daily: wagered_* and won_* columns, in EUR"
  how: "GGR = wagered minus won, where wagered is wagered_real_eur + wagered_released_bonus_eur + wagered_playable_bonus_eur and won is the same three columns of won. Summed from 6 months ago to yesterday, by platform and game_id (lower case, letters and digits only), then sent to game_uid with slv_games_discovered_resolved. The list keeps the games with positive GGR, from the highest, until they hold 99% of the positive GGR. It is frozen on 2026-10-28, and games matched was made on it. Here: the GGR of this game_uid. Empty if the game_uid is not in that list. The query is in the sheet sources"
rounds_6m:
  source: "ClickHouse slv_game_daily (the 99% list of 2026-10-28)"
  meaning: "Rounds played in the last 6 months. Second key of the order of the catalog"
  origin: "slv_game_daily: rounds"
  how: "Sum of rounds over the same days, platforms and games as ggr_eur_6m. Here: the rounds of this game_uid. Empty if the game_uid is not in the list"
provider:
  meaning: "Standard provider (the studio) as a slug"
  origin: "studio, provider list"
  how: "The studio is turned into a slug (lower case, no accents or symbols) and looked up in the provider list (sheet sources), which maps every spelling to one standard name (Pragmatic Live Casino gives pragmatic-play). A studio that is not in the dictionary keeps its own slug. If the studio was taken from another game with the same name (studio_source = same_name of master_catalog_full.xlsx), the provider is the one of that game"
provider_id:
  meaning: "Our own ID of the provider. One per standard provider"
  origin: "provider"
  how: "uuid5(NAMESPACE, '<provider>'), with the same NAMESPACE as whizdom_game_id"
id_version:
  meaning: "Version of the rules that make the IDs"
  origin: "the rules of the ID"
  how: "A constant, now 2 (version 2 tells apart the games with the same name and provider: see variant). It changes only if the slug or the way of making the ID changes on purpose"
variant:
  meaning: "Empty for most games. If the same name and provider are two different games, what tells them apart: rtp 95.02 (the RTP of the casino) or type Roulette (the game type). Each variant has its own whizdom_game_id"
  origin: "game_name, provider, ref_rtp, ca_rtp, ref_game_type, ca_game_type"
  how: "Within the game_uid of one name and provider: if their RTP differs by more than 0.1 points, the variant is the RTP; else, if their game type differs, it is the type. The volatility is not used, because it differs between platforms for the same game"
studio:
  meaning: "Studio that made the game, as the source writes it. provider has it in standard form"
  origin: "ref_studios, ca_provider, sc_provider, ref_provider_name"
  how: "The first of these that is not empty, in this order. sc_provider is the provider of the Slot Catalog JSON found by the UUID of the Slot Catalog URL file. The last one is the platform. Then a game takes the studio of another game with the same name and the same RTP from a better source (order: ref_games, Client Area, JSON, platform). That is same_name: it joins, for example, the distributor ORYX with the studio Gamomat"
studio_source:
  meaning: "Where studio comes from"
  origin: "ref_studios, ca_provider, sc_provider, ref_provider_name"
  how: "ref_games (studios), client_area (Provider), slotcatalog_json, platform (no studio is known, the platform is used), or same_name (taken from another game with the same name and RTP)"
first_seen:
  meaning: "First day the game_uid was seen in the data (ref_games). 2025-04-01 is the first day of the data: it only means seen since the start"
  origin: "ref_first_seen"
  how: "The date of ref_first_seen. Empty for the games only in other sources"
last_seen:
  meaning: "Last day the game_uid was seen in the data (ref_games). A recent day means the game is active; an old day means it is not played any more. Empty: it was never seen in the activity"
  origin: "ref_last_seen"
  how: "The date of ref_last_seen. Empty for the games only in other sources"
vertical:
  meaning: "Group of the game in ref_games (Slots, Table Games, Instant Win, Live Casino, Poker, Virtual Sports...)"
  origin: "ref_vertical"
  how: "Copied from ref_vertical"
platform:
  meaning: "Platform code of this row (the platform that sells this game_uid). platforms has all the platforms of the game"
  origin: "ref_provider_code, else ca_platform, scu_platform, ge_platform_code (for the games only in other sources)"
  how: "ref_provider_code; for a game that is not in ref_games, the platform of its source"
theme:
  meaning: "Themes of the game (Fruit, Egypt, Gods, Blue...), from every source in one list"
  origin: "ref_theme, ca_theme, ge_theme_y, gm_theme, sc_theme"
  how: "Every word of every source, split by comma, | or ; (not inside brackets). The same word is written once: two words are the same if they only differ in case, spaces, hyphens, a final s, the end theme or the start Feature: (Fruit theme and Fruit, Animals and Animal). Each word is written as most sources write it, with capitals first. Sorted and joined with a comma"
features:
  meaning: "Features of the game (Free Spins, Wild, Multiplier, Buy Feature...), from every source in one list"
  origin: "ge_features, sc_features, gm_features"
  how: "As theme: every word of every source, each once (Free Spins and FreeSpins are one), sorted and joined with a comma. Risk/Gamble (Double) game is one feature: / is not a separator"
status:
  meaning: "Commercial status of the game (released, disabled, review, upcoming)"
  origin: "ref_status, ca_status"
  how: "ref_status; if empty, the Status of the Client Area"
game_type:
  meaning: "Type of game in the words of the casino (Slots, Blackjack, Roulette, Instant games, Live casino...)"
  origin: "ref_game_type, ca_game_type, sc_game_type, gm_game_type"
  how: "ref_game_type (an empty text is no type); if empty, the Game type of the Client Area; if empty, the type of Slot Catalog, then of games matched, written in the words of the casino: Video Slots and Classic Slots are Slots, Roulette Games is Roulette, Live Casino Games is Live casino, Scratch tickets and Dice Games are Instant games (Other types says nothing). Unassigned is no type"
is_sports:
  meaning: "true if the game is sports betting. It has no Slot Catalog page"
  origin: "ref_provider_code"
  how: "true if the platform code is one of the sports betting platforms (BETTECH, DIGITAIN_SPORTBOOK)"
url:
  meaning: "Page of the game (click to open): Slot Catalog, else the page that games matched found on another website (the studio, SlotsLaunch, SlotRanker...)"
  origin: "scu_sc_url, source_url of the Slot Catalog JSON, ca_external_resource, gm_sc_url, gm_all_links"
  how: "The first of these that is not empty, in this order: the Slot Catalog URL file, the Slot Catalog JSON, the Client Area External Resource (only if it contains slotcatalog). If the game has none and games matched has matched it, the link of games matched, in this order of websites: Slot Catalog, the studio, SlotsLaunch, SlotRanker, SlotsUp, AboutSlots, Slottomat, AskGamblers, SlotTracker, SlotJava, Slot Report, web research. A game that games matched has only as fuzzy has candidates that are not confirmed, so its links are not used. The website is in url_site and the source in the column url_source of master_catalog_full.xlsx"
url_site:
  meaning: "Website of url: Slot Catalog, Studio site, SlotsLaunch, SlotRanker, SlotsUp, AboutSlots, Slottomat, AskGamblers, SlotTracker, SlotJava, Slot Report or Web research"
  origin: "url"
  how: "Slot Catalog if the url is of Slot Catalog; else the website of the link of games matched that was used"
url_source:
  meaning: "Where url comes from"
  origin: "scu_sc_url, source_url of the Slot Catalog JSON, ca_external_resource"
  how: "slotcatalog_file (the Slot Catalog URL file), raw_json (the Slot Catalog JSON), client_area, or none"
match_status:
  meaning: "How sure is the link of the game with a Slot Catalog page and its sc_ data"
  origin: "whizdom_game_id, scu_game_id, Slot Catalog JSON"
  how: "The Slot Catalog JSON found by name + provider is compared with the one found by the platform ids (UUID of the Slot Catalog URL file). exact: the JSON found by ids has the same whizdom_game_id as the game. review: only one way finds a JSON, they disagree, or only a close name exists. no_match: nothing is found"
close_name:
  meaning: "A name of the same provider in the Slot Catalog JSON that is very close to the game"
  origin: "game_slug, provider, names of the Slot Catalog JSON"
  how: "Only for games with no JSON found. difflib.get_close_matches with similarity 0.9 or more, among the JSON of the same provider, never the same name"
missing_data:
  meaning: "Key fields that are empty"
  origin: "game_name, studio_source, game_type"
  how: "A list: name (no name), studio (studio_source of master_catalog_full.xlsx is platform or none, so the real studio is not known), game_type (empty)"
no_url:
  meaning: "true if the game has no Slot Catalog URL"
  origin: "url"
  how: "true when url is empty"
similar_provider:
  meaning: "true if another provider has almost the same name (for example high5 and high-5-games). They can be one provider with two names: a person must decide if they are merged. The sheet providers shows the other name in similar_to"
  origin: "provider, studio names of all the sources"
  how: "Provider names are compared without words like gaming, games, casino, live or studios and without hyphens. If two names give the same core but are two different providers, both are marked"
id_shared:
  meaning: "true if more than one game_uid of ref_games has this ID, usually the same game on two platforms"
  origin: "whizdom_game_id, ref_game_uid"
  how: "Count of game_uid by whizdom_game_id over the whole base list, greater than 1"
same_platform_conflict:
  meaning: "true if two game_uid of the same platform have this ID. So far they are the same game with two ids and the same RTP: two rows of the catalog"
  origin: "whizdom_game_id, ref_provider_code"
  how: "true if the pair (whizdom_game_id, platform code) is repeated"
platforms:
  meaning: "Platforms that sell the game"
  origin: "ref_provider_code"
  how: "The platform codes of all the game_uid of the ID, without repeats, sorted and joined with a comma"
only_in:
  meaning: "Empty for the game_uid of ref_games. For a game that is not in ref_games, the sources that have it (Client Area, games_enriched, Slot Catalog URL file, Slot Catalog JSON). These rows are at the end and have no GGR"
  origin: "Client Area, games_enriched, Slot Catalog URL file, Slot Catalog JSON"
  how: "The rows of these sources whose platform key is not in ref_games (or whose JSON is linked to no game), and that are a new game: a new whizdom_game_id, or a name that is not in the catalog when no source has a provider. One row per game; each column takes the first value in the order Client Area, games_enriched, Slot Catalog URL file, Slot Catalog JSON"
platform_rows:
  meaning: "How many game_uid of ref_games have this ID, so how many rows of the catalog have it"
  origin: "ref_game_uid"
  how: "Count of game_uid by whizdom_game_id"

# ---- columns of ref_games (ClickHouse). Copied as they are ----
ref_provider_code:
  meaning: "Code of the platform that sells the game (ISOFTBET, EVO_CAS...). It is not the studio"
ref_studios:
  meaning: "Studio that made the game, as ref_games has it. Often empty"
ref_vertical:
  meaning: "Group of the game (Slots, Table Games, Instant Win, Live Casino, Poker...)"
ref_theme:
  meaning: "Themes of the game in ref_games"
ref_volatility_class:
  meaning: "Volatility in ref_games (low, low - medium, medium, medium - high, high, very high). Often empty"
ref_jackpot:
  meaning: "Jackpot type in ref_games (no, yes, yes fixed...). Often empty"
ref_has_buy_bonus:
  meaning: "1 if the game has a buy bonus, 0 if not"
ref_has_freespins:
  meaning: "1 if the game has free spins, 0 if not"
ref_min_bet:
  meaning: "Minimum bet in ref_games (decimal)"
ref_max_bet:
  meaning: "Maximum bet in ref_games (decimal)"
ref_release_date:
  meaning: "Release date in ref_games. 2022-01-01 is a placeholder, not a real date: many games share it"
ref_first_seen:
  meaning: "First day the game was seen in the data. 2025-04-01 is the first day of the data: it only means 'seen since the start'"
ref_last_seen:
  meaning: "Last day the game was seen in the data. The catalog keeps all the games, also the ones not seen for a long time"
ref_enrichment_status:
  meaning: "State of the game in the pipeline of ref_games: enriched, catalogued or discovered. It is not the classification of games_enriched"
ref_in_cms:
  meaning: "0 or 1 flag of ref_games. By its name, the game is in the CMS. There is no definition in the repository"
ref_in_transactions:
  meaning: "0 or 1 flag of ref_games. By its name, the game has transactions. There is no definition in the repository"
ref_in_client_area:
  meaning: "0 or 1 flag of ref_games. By its name, the game is in the Client Area. There is no definition in the repository"
ref_total_txn_count:
  meaning: "Number of transactions of the game, by its name. There is no definition in the repository"
ref_n_brands:
  meaning: "Number of brands that have the game, by its name. There is no definition in the repository"
ref__version:
  meaning: "Technical: version of the row in ClickHouse (ref_games is read with FINAL, so only the last version is here). It is not data of the game"
ref__ingested_at:
  meaning: "Technical: when ClickHouse loaded the row. It is not data of the game"

# ---- columns of the Slot Catalog URL file ----
scu_sc_url:
  meaning: "Slot Catalog page of the game, in the Slot Catalog URL file. The first source of url"
scu_game_name:
  meaning: "Name of the game in the Slot Catalog URL file. The name of the Slot Catalog JSON comes from here, because the page title has extra text"
scu_provider:
  meaning: "Studio of the game in the Slot Catalog URL file"
scu_platform:
  meaning: "Platform code in the Slot Catalog URL file. With the game id, it joins the file to ref_games"

# ---- columns of the raw Slot Catalog JSON that are not a field of raw_data ----
sc_extracted_at:
  origin: "extraction_timestamp of the JSON file"
  how: "The date (without the hour) when the Slot Catalog page was read, written in the JSON when the page was read. Not a field of raw_data"
  meaning: "Date when the Slot Catalog page of the game was read"

# ---- where the attributes come from, and games matched (gm_) ----
attributes_from:
  meaning: "Which file gives the attributes of the game: games_enriched (ge_ columns), games matched (gm_ columns: 'games matched, matched', or 'games matched, fuzzy' when the match is not confirmed) or 'games matched, unmatched (pending)' when the game has no match yet. 'not in games_enriched or games matched': its attributes come only from ref_games, the Client Area and Slot Catalog. games_enriched wins: a game in both stays games_enriched (column also_in_games_matched of master_catalog_full.xlsx)"
  origin: "ge_ columns, gm_status"
  how: "games_enriched if the game has any ge_ column; else matched, fuzzy or unmatched (pending) from gm_status; else not in games_enriched or games matched"
in_games_enriched:
  meaning: "true if the game is in games_enriched, the games that were already classified. Their attributes are in the ge_ columns"
  origin: "ge_ columns"
  how: "true if any ge_ column has a value. The ge_ data of the other game_uid of the same ID only fill the empty cells"
also_in_games_matched:
  meaning: "true if the game is in games_enriched and also in games matched: it is the same game with two game_uid on the same platform (for example Janissaries). games_enriched has one game_uid and games matched the other. Its attributes are the ones of games_enriched, so the work of games matched on it is repeated"
  origin: "in_games_enriched, gm_status"
  how: "true if in_games_enriched and gm_status has a value"
gm_status:
  meaning: "Status of the game in games matched: matched (confirmed), fuzzy (candidates not confirmed) or unmatched (no candidate yet). Empty if the game is not in games matched (it was not in the list of 2951 games)"
  origin: "overall_status of the sheets matched, fuzzy_review and unmatched"
  how: "The row of this game_uid in games matched. A game_uid that is not in games matched takes the row of its game (another game_uid with the same ID; the best status: matched, then fuzzy, then unmatched), because the attributes are of the game on any platform"
gm_batch:
  meaning: "Batch of the list of 2951 games that the game belongs to (batch 1, batch 2 or batch 3)"
  how: "The three batches of games matched, numbered in alphabetical order of their name"
gm_match_basis:
  meaning: "Why games matched calls it matched: automatic, or verified on the website of the studio (confirmed or corrected)"
gm_unmatched_reason:
  meaning: "Why games matched has no match: no candidate in any source, no game name, or the candidate was rejected on the website of the studio"
gm_verify_verdict:
  meaning: "Result of the check on the website of the studio: confirmed, corrected, rejected or unverifiable"
gm_sc_url:
  meaning: "Slot Catalog page of the game in games matched (the existing url or the one its scraper found)"
gm_all_links:
  meaning: "Every link that games matched has for the game, one per line, labelled with the website (studio, Slot Catalog, each crawler site, web research)"
gm_n_attribute_conflicts:
  meaning: "How many attributes have sources that disagree in games matched"
gm_rtp_differs_from_name:
  meaning: "true if the RTP differs by more than 1 point from the one in the name of a variant (94 Low Rtp). The RTP can be the one of the base game"
  origin: "gm_rtp, game_name"
  how: "The RTP written in the name is read (Le Fisherman 94 Low Rtp is 94) and compared with gm_rtp"
gm_rtp_from_text:
  meaning: "true if gm_rtp was read from a sentence (96.25% base; no 94% version found) and not from an exact value. It can be the RTP of the base game"
gm_max_win_from_text:
  meaning: "true if gm_max_win was read from a sentence, and it can be a multiple of one line or a jackpot"
gm_volatility_from_text:
  meaning: "true if gm_volatility was read from a sentence: the first level of the first statement, with -Adjustable if it says adjustable"
gm_max_win_amount:
  meaning: "Max win written in money (EUR 250,000), which is not a multiple of the bet, so it is not in gm_max_win"
gm_max_win_currency:
  meaning: "Currency of gm_max_win_amount"
