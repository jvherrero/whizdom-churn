months: 6          # activity window
coverage: 0.99     # the smallest set of games with 99% of the positive GGR in the window
# Inputs of priority_list.py
sa_urls: internal_taxonomy/game_slotcatalog_urls.xlsx                   # Slot Catalog URLs
client_area: internal_taxonomy/game-filtered-20261027103158-2cb5.csv   # export of the Client Area
games_enriched: internal_taxonomy/games_enriched.xlsx                   # games already classified
slotcatalog_json: internal_taxonomy/sa_raw                               # raw Slot Catalog JSON of SA, one file per game
# Dates in ref_games that are not a real launch
placeholder_release_date: 2022-01-01
data_start: 2025-04-01
# Providers that are sports betting (single, combo...)
sports_provider_codes: [BETTECH, DIGITAIN_SPORTBOOK]
# Games that have no name in any source and are named on purpose, "<provider_code>/<game_id>": name. They hold a large part of the
# GGR (sports betting), so they must be in the master catalog. The Digitain ids are not explained anywhere: the name only repeats the id.
explicit_names:
  BETTECH/single: Sports Betting Single (Betby)
  BETTECH/combo: Sports Betting Combo (Betby)
  BETTECH/system: Sports Betting System (Betby)
  DIGITAIN_SPORTBOOK/1: Sports Betting 1 (Digitain)
  DIGITAIN_SPORTBOOK/2: Sports Betting 2 (Digitain)
  DIGITAIN_SPORTBOOK/3: Sports Betting 3 (Digitain)

# Batches of providers for the labelling split (split_batches.py): one file per name in output/
splits: [javier, navid, sudhamshu]
# Master catalog (master.ipynb, master_lib.py, providers.yaml)
master_out: output/master                       # parquet and summary of the master (ignored by git)
master_seen_since: 2025-01-01                   # base list of the master: games of ref_games with last_seen on or after this day
master_ggr: output/active_games.csv             # GGR and rounds by game_uid for the order of the catalog (frozen list of 2026-10-28)
sa_raw_zip: s3://whizdomai-datalake/gamingtec/datalake/00-reference-data/whizdomai-games/data.zip
sa_raw_profile: whizdomai-platform-prod         # AWS profile with read access to that bucket
navid_final:                                    # pending: path of the final file of Navid (crawl, URLs, schema)
