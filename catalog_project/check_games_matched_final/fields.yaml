# Map of the attributes of games_matched_final.xlsx (Navid): where each one is written and how it could be unified.
#   attr:    the consolidated column of Navid (attr_<field>), if there is one
#   sources: other columns of the games table that can hold the same information
#   records: the column of the sheet crawler_records (one row per game and website)
#   kind:    number, category, list, date or text (it decides how the formats are studied)
#   group:   the category of the attribute (math, bets, gameplay, classification, dates, texts, studio_website, community, technical): the
#            percent of empty fields is also calculated by group
#   third_party_text: true if it is text copied from a third party website (the team has not decided if it enters the catalog)
#   order / normalize / conflict: the PROPOSED rule to unify the field. A proposal to validate with Navid, not a decision.
#   unify: false if unify.ipynb leaves the field out (the master catalog makes it, or it is raw page text).
# The sources are in the order that Navid uses for the attr_ column: Slot Catalog, a matched crawler site, web research.

fields:
  rtp:
    attr: attr_rtp
    sources: [sc_rtp, crawler_rtp, research_rtp]
    records: rtp_percent
    kind: number
    group: math
    order: "Slot Catalog, crawler sites, web research"
    normalize: "A number in percent. Remove the % sign. Research writes text (96.75%, 'Base 96.14% (official); ~94% variant'): take the first number and mark it. A value outside 50 to 100 is an error and is left empty. An RTP of 0 is valid (a table game like blackjack has no RTP)."
    conflict: "Yes if two sources differ by more than 0.15 points (Navid's rule)."
  volatility:
    attr: attr_volatility
    sources: [sc_variance, crawler_volatility, research_volatility]
    records: volatility
    kind: category
    group: math
    order: "Slot Catalog, crawler sites, web research"
    normalize: "One scale: Low, Low-Medium, Medium, Medium-High, High, Very High. High volatility, HIGH and high become High; Med becomes Medium; Medium/High becomes Medium-High. Adjusted, Variable and Selectable levels become Adjusted. A rating out of 5 is a level: 5/5 Very High, 4/5 High, 3.5/5 Medium-High, 3/5 Medium, 2.5/5 Low-Medium, 2/5 Low, 1/5 Very Low (6/10 is 3/5); with a label the rating decides. A text with two statements (a site says Low, another Medium) or a label with a comment (High (adjustable)) is not read. A text that does not match an exact form is read from the sentence: the first level of the first statement, with -Adjustable if it says adjustable or selectable (High (adjustable) is High-Adjustable; Low (2/5); another site says Medium is Low). Marked in volatility_from_text."
    conflict: "Yes if the level differs."
  max_win:
    attr: attr_max_win
    sources: [sc_max_win, sc_max_win_2, research_max_win]
    records: max_win_multiplier
    kind: number
    group: math
    order: "Slot Catalog, crawler sites, web research"
    normalize: "A number, the multiple of the bet. x5000.00, 10,000x and 5000 are 5000 and 10000. A multiple with a comment (5,000x (max exposure multiplier)) is the multiple. A payout Straight-up 35:1 or Payouts up to 1,300:1 is 35 and 1300. An amount in money (EUR 250,000) is not a multiple: it goes to max_win_amount and max_win_currency. A text with two statements, a multiple of one line only or no max win stated is not read. sc_max_win_2 has only a few values that look like money, not a multiple: leave it out."
    conflict: "Yes if two sources differ by more than 1%."
  min_bet:
    attr: attr_min_bet
    sources: [sc_min_bet, sc_min_bet_2]
    kind: number
    group: bets
    order: "Slot Catalog"
    normalize: "A number. EUR 0.01 is 0.01. The currency is not written in most sources: check it before using it."
    conflict: "Yes if two sources differ by more than 1%."
  max_bet:
    attr: attr_max_bet
    sources: [sc_max_bet, sc_max_bet_2]
    kind: number
    group: bets
    order: "Slot Catalog"
    normalize: "A number. EUR 50 is 50. A text that does not give an amount (High maximum bets (not quantified)) is not read. The currency is not written in most sources: check it before using it."
    conflict: "Yes if two sources differ by more than 1%."
  bet_range:
    attr: attr_bet_range
    sources: [research_bet_range]
    records: bet_range
    kind: text
    group: bets
    order: "Crawler sites (slotsup), web research"
    normalize: "Split into min and max (numbers) and a currency. '$0.2 - $100' and '0.10-100' are the same shape. It can fill min_bet and max_bet when they are empty."
    conflict: "No rule yet."
  layout:
    attr: attr_layout
    sources: [sc_layout, research_layout]
    records: layout
    kind: category
    group: gameplay
    order: "Slot Catalog, web research"
    normalize: "Reels and rows as in Slot Catalog (5-3, 3-4-4-4-3). 5x4, 14 paylines becomes 5-4. 4 reels 3-5-5-3 becomes 3-5-5-3. Text that is not a layout of that kind (5 reels, 6 reels up to 117,649 ways, Single-zero wheel) is kept as it is written."
    conflict: "Yes if the digits differ."
  paylines_ways:
    attr: attr_paylines_ways
    sources: [sc_betways]
    kind: category
    group: gameplay
    order: "Slot Catalog"
    normalize: "A number of paylines or ways, or a mechanic (Cluster pays). Keep them in two columns."
    conflict: "No rule yet."
  hit_frequency:
    attr: attr_hit_frequency
    sources: [sc_hit_frequency]
    records: hit_frequency_percent
    kind: number
    group: math
    order: "Slot Catalog, crawler sites"
    normalize: "A number in percent."
    conflict: "Yes if two sources differ by more than 1%."
  release_date:
    attr: attr_release_date
    sources: [sc_release_date, crawler_release_date, research_release_date]
    records: release_date
    kind: date
    group: dates
    order: "Slot Catalog, web research, crawler sites"
    normalize: "An ISO date (2024-03-28) and the precision (day or year). Slot Catalog writes 28/03/2024, research 2024-10-16, crawler sites a year or 'September 10, 2026'. A text with several dates (2022-01-28 (exclusive); 2022-02-18 (wide)) gives the earliest, the first release."
    conflict: "Yes if the year differs."
  wide_release_date:
    sources: [sc_wide_release_date]
    kind: date
    group: dates
    order: "Slot Catalog"
    normalize: "An ISO date. It is the wide release, not the first release: it matches attr_release_date in only 4.5% of the games, so it is not used to fill release_date."
    conflict: "No other source."
  game_type:
    attr: attr_game_type
    sources: [sc_type, research_game_type]
    kind: category
    group: classification
    order: "Slot Catalog, web research"
    normalize: "The types of Slot Catalog, with its criterion: Video Slots (also Video slot (cluster pays)), Classic Slots, Live Casino Games (any live dealer game: live dealer blackjack, automated live roulette, game show), Card games (blackjack, poker or baccarat table without live), Roulette Games, Dice Games, Scratch tickets, Other types (also crash and instant games, which Slot Catalog does not separate)."
    conflict: "No rule yet."
  theme:
    attr: attr_theme
    sources: [sc_theme, crawler_themes, research_theme]
    records: themes
    kind: list
    group: classification
    order: "Union of all sources"
    normalize: "Split by | (Slot Catalog) and by comma. One list without repeats, ignoring case. Fruit and Fruit theme are close: needs a vocabulary."
    conflict: "No rule: values are added."
  features:
    attr: attr_features
    sources: [sc_features]
    records: features
    kind: list
    group: gameplay
    order: "Union of all sources"
    normalize: "Split by |. N/A is empty. One list without repeats."
    conflict: "No rule: values are added."
  mechanics:
    attr: attr_mechanics
    sources: [research_mechanics]
    records: mechanics
    kind: list
    group: gameplay
    order: "Crawler sites, web research"
    normalize: "The crawler gives a short list (Cascading Reels). Research gives free text: keep it apart, as notes."
    conflict: "No rule: values are added."
  objects_tags:
    attr: attr_objects_tags
    sources: [sc_objects, sc_other_tags]
    kind: list
    group: gameplay
    order: "Slot Catalog"
    normalize: "Split by |. Tags like 5 Reels or 96% RTP repeat other fields (layout, rtp): consider dropping them."
    conflict: "No rule: values are added."
  description:
    attr: attr_description
    sources: [sc_description, crawler_description, research_description]
    records: description
    kind: text
    group: texts
    third_party_text: true
    order: "Slot Catalog, crawler sites, web research"
    normalize: "Keep one text and its source. Do not mix texts of different sites."
    conflict: "Not compared."
  review_text:
    attr: attr_review_text
    sources: [research_reviews]
    records: review_text
    kind: text
    group: texts
    third_party_text: true
    order: "Crawler sites, web research"
    normalize: "Keep one text and its source."
    conflict: "Not compared."
  pros:
    attr: attr_pros
    sources: [sc_pros]
    records: pros
    kind: text
    group: texts
    third_party_text: true
    order: "Slot Catalog, crawler sites"
    normalize: "Keep one text and its source."
    conflict: "Not compared."
  cons:
    attr: attr_cons
    sources: [sc_cons]
    records: cons
    kind: text
    group: texts
    third_party_text: true
    order: "Slot Catalog, crawler sites"
    normalize: "Keep one text and its source."
    conflict: "Not compared."
  faqs:
    attr: attr_faqs
    records: faqs
    kind: text
    group: texts
    third_party_text: true
    order: "Crawler sites"
    normalize: "Keep one text and its source."
    conflict: "Not compared."
  user_reviews:
    attr: attr_user_reviews
    records: user_reviews
    kind: text
    group: texts
    third_party_text: true
    order: "Crawler sites"
    normalize: "Empty in the whole file."
    conflict: "Not compared."
  rules:
    attr: attr_rules
    kind: text
    group: studio_website
    order: "Studio website"
    normalize: "Keep the text and its source (only from the website of the studio, added in the file of 2026-11-03)."
    conflict: "Not compared."
  side_bets:
    attr: attr_side_bets
    kind: text
    group: studio_website
    order: "Studio website"
    normalize: "Keep the text and its source. It is a list written with ; (Pair Plus; Six Card Bonus)."
    conflict: "Not compared."
  languages:
    attr: attr_languages
    kind: text
    group: studio_website
    order: "Studio website"
    normalize: "Keep the text and its source. Often at the level of the studio, not of the game ('35+ languages (portfolio level)')."
    conflict: "Not compared."
  community_rtp:
    attr: attr_community_rtp
    records: community_rtp_percent
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "A number in percent (the RTP measured by the players of a site, not the official one)."
    conflict: "Not compared."
  community_hit_rate:
    attr: attr_community_hit_rate
    records: community_hit_rate
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "Written 1/3.6 (one every 3.6 spins): converted to percent, 100 / 3.6 = 27.78. Checked against hit_frequency of Slot Catalog: median difference 0.68 points. Only the exact form 1/number."
    conflict: "Not compared."
  community_best_win:
    attr: attr_community_best_win
    records: community_best_win_multiplier
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "A number, the multiple of the bet."
    conflict: "Not compared."
  community_volatility:
    records: community_volatility
    kind: category
    group: community
    order: "Crawler sites"
    normalize: "Same scale as volatility."
    conflict: "Not compared."
  community_total_spins:
    records: community_total_spins
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "A number."
    conflict: "Not compared."
  community_total_bonuses:
    records: community_total_bonuses
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "A number."
    conflict: "Not compared."
  community_bonus_frequency:
    records: community_bonus_frequency
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "Written 1/3.6 (one every 3.6 spins): converted to percent, 100 / 3.6 = 27.78. Checked against hit_frequency of Slot Catalog: median difference 0.68 points. Only the exact form 1/number."
    conflict: "Not compared."
  community_average_bonus_multiplier:
    records: community_average_bonus_multiplier
    kind: number
    group: community
    order: "Crawler sites"
    normalize: "A number."
    conflict: "Not compared."
  community_stats_updated:
    records: community_stats_updated
    kind: date
    group: community
    order: "Crawler sites"
    normalize: "A date."
    conflict: "Not compared."
  game_text:
    records: game_text
    kind: text
    third_party_text: true
    order: "Crawler sites"
    normalize: "Raw text of the page: not an attribute."
    conflict: "Not compared."
    unify: false
  sections:
    records: sections
    kind: text
    third_party_text: true
    order: "Crawler sites"
    normalize: "Raw text of the page: not an attribute."
    conflict: "Not compared."
    unify: false
  studio:
    sources: [own_studio, sc_provider, crawler_provider, research_studio]
    records: provider
    kind: category
    order: "Our studio, Slot Catalog, crawler sites, web research"
    normalize: "Through providers.yaml (one standard provider)."
    conflict: "Yes if the standard provider differs."
    unify: false                     # the master catalog makes the studio
  official_name:
    sources: [sc_title, crawler_name, research_official_name]
    records: name
    kind: text
    order: "Web research, crawler sites, Slot Catalog"
    normalize: "Titles carry extra text (Demo, Game Info): do not use them as the name of the game."
    conflict: "Not compared."
    unify: false                     # the master catalog makes the name
  technology:
    sources: [sc_technology]
    kind: list
    group: technical
    order: "Slot Catalog"
    normalize: "Only in Slot Catalog."
    conflict: "No other source."
  game_size:
    sources: [sc_game_size]
    kind: text
    group: technical
    order: "Slot Catalog"
    normalize: "Only in Slot Catalog."
    conflict: "No other source."
  last_update:
    sources: [sc_last_update]
    kind: date
    group: dates
    order: "Slot Catalog"
    normalize: "Only in Slot Catalog: the date of the scraper, not of the game."
    conflict: "No other source."
  genre:
    sources: [sc_genre]
    kind: category
    group: classification
    order: "Slot Catalog"
    normalize: "Only in Slot Catalog."
    conflict: "No other source."
  blog_articles:
    sources: [sc_blog_articles]
    kind: text
    group: texts
    third_party_text: true
    order: "Slot Catalog"
    normalize: "Only in Slot Catalog."
    conflict: "No other source."
  end_date:
    sources: [sc_end_date]
    kind: date
    group: dates
    order: "Slot Catalog"
    normalize: "Empty in the whole file."
    conflict: "No other source."

# Columns that are not attributes of the game: ids, the match, links and the check on the website of the studio.
# A name ending with * is a prefix. The attr_*_source, _all_sources and _conflict columns follow their attr_ column.
ignore: [overall_status, match_basis, batch, rank, provider_name, game_name, name_used, game_id, game_uid, n_links, all_links,
         n_attribute_conflicts, conflicting_attributes, name_source, existing_sc_url, existing_sc_url_source, normalised_name,
         unmatched_reason, sc_status, sc_method, sc_url, sc_slug, sc_rejected_candidate, crawler_status, crawler_method, crawler_sites,
         crawler_n_records, crawler_urls, crawler_rejected_candidate, research_status, research_confidence, research_notes,
         research_sources, "verify_*",
         site, url, is_game, resolved_url, fetched_at, reparsed_at, recovered_at]
