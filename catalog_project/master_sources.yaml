# Where the data of the master catalog come from. master.ipynb writes it as the sheet "sources" and adds the rows and
# the text of the query (the file in sql/ is read when the notebook runs, so the sheet shows the query that was used).
- prefix: "ref_"
  source: "ClickHouse table ref_games"
  where: "whizdomai_org_gmntc_medallion.ref_games FINAL"
  sql: "sql/ref_games_master.sql"
  how: "Every column and one row per game_uid (FINAL keeps the last version of each row). The base list of the catalog is the rows with last_seen on or after master_seen_since (config.yaml)."
  joined: "It is the base list: every other source joins to it."
- prefix: "ggr_eur_6m, rounds_6m"
  source: "ClickHouse tables slv_game_daily and slv_games_discovered_resolved"
  where: "file output/active_games.csv (made by active_games.py, frozen on 2026-10-28)"
  sql: "sql/active_games.sql"
  how: "GGR = wagered minus won in EUR (real money and bonus), and rounds, over the last 6 full months. The result is cut to the games that hold 99% of the positive GGR, from the highest GGR, then rounds, then game_uid. The file is not made again: Navid works on this list."
  joined: "By game_uid. The catalog sums all the game_uid of one ID. Games that are not in the list have no GGR."
- prefix: "ca_"
  source: "Client Area export (CSV)"
  where: "internal_taxonomy/game-filtered-20261027103158-2cb5.csv"
  how: "Every column is copied. The names are turned into lower case with underscores (Core Id Desktop gives ca_core_id_desktop)."
  joined: "By key = game id normalized (lower case, letters and digits only) + platform code. Core Id Desktop is tried first, then Core Id Mobile. One row per key."
- prefix: "sa_"
  source: "Slot Catalog URL file of SA (Excel)"
  where: "internal_taxonomy/game_slotcatalog_urls.xlsx"
  how: "Every column is copied. It gives the URL of the Slot Catalog page and the UUID of the raw JSON of the game."
  joined: "By key = game id normalized + platform. game_src_id is tried first, then core_id_desktop. One row per key; the rows with a URL come first."
- prefix: "ge_"
  source: "games_enriched (Excel), the games SA already classified"
  where: "internal_taxonomy/games_enriched.xlsx"
  how: "Every column is copied, except the index and the three columns of the old ranking (dervied_rank, total_bets_pct, totatl_bets_cumsum), which are not data of the game."
  joined: "By key = game id normalized + platform_code. game_src_id, then core_desktop_id, then core_mobile_id."
- prefix: "sc_"
  source: "Raw JSON of Slot Catalog (one file per game)"
  where: "internal_taxonomy/sa_raw/ (from S3 data.zip, folder data/raw)"
  how: "Each field of raw_data is cleaned: the page marks [ i ] are removed, lists are written as a, b, c, the Play at the start of the title is removed, and sc_rtp is a number (a value outside 50 to 100 is an error of the page and is left empty). The whole JSON is kept in raw_sources.parquet."
  joined: "By the UUID of the SA file (match by ids), else by name + provider. match_status says how sure the link is."
- prefix: "explicit_names"
  source: "config.yaml"
  where: "explicit_names"
  how: "Names written on purpose for the sports betting games, which have no name in any source."
  joined: "By platform code / game id, only where no source has a name."
- prefix: "providers.yaml"
  source: "Rebranding dictionary of providers"
  where: "providers.yaml"
  how: "Maps every spelling of a provider to one standard name, so the same studio always gives the same provider and Provider ID."
  joined: "By the slug of the studio."
