# Where the data of the master catalog come from. master.ipynb writes it as the sheet "sources" and adds the rows and
# the text of the query (the file in sql/ is read when the notebook runs, so the sheet shows the query that was used).
# These texts go to the Excel: they name the files that the team has, never a local file or a person.
- prefix: "ref_"
  source: "ClickHouse table ref_games"
  where: "whizdomai_org_gmntc_medallion.ref_games FINAL"
  sql: "sql/ref_games_master.sql"
  how: "Every column and one row per game_uid (FINAL keeps the last version of each row). The base list of the catalog is all of them, with no filter by date."
  joined: "It is the base list: every other source joins to it."
- prefix: "ggr_eur_6m, rounds_6m"
  source: "ClickHouse tables slv_game_daily and slv_games_discovered_resolved"
  where: "the 99% list of 2026-10-28 (the query below, run once on that day and frozen)"
  sql: "sql/active_games.sql"
  how: "GGR = wagered minus won in EUR (real money and bonus), and rounds, over the last 6 full months. The result is cut to the games that hold 99% of the positive GGR, from the highest GGR, then rounds, then game_uid. The list is not made again: games matched was made on it."
  joined: "By game_uid: each row of the catalog has the GGR and rounds of its own game_uid. Rows that are not in the list have no GGR."
- prefix: "ca_"
  source: "Client Area export (CSV)"
  where: "game-filtered-20261027103158-2cb5.csv"
  how: "Every column is copied. The names are turned into lower case with underscores (Core Id Desktop gives ca_core_id_desktop)."
  joined: "By key = game id normalized (lower case, letters and digits only) + platform code. Core Id Desktop is tried first, then Core Id Mobile. One row per key."
- prefix: "scu_"
  source: "Slot Catalog URL file (Excel)"
  where: "game_slotcatalog_urls.xlsx"
  how: "Every column is copied. It gives the URL of the Slot Catalog page and the UUID of the Slot Catalog JSON of the game."
  joined: "By key = game id normalized + platform. game_src_id is tried first, then core_id_desktop. One row per key; the rows with a URL come first."
- prefix: "ge_"
  source: "games_enriched (Excel), the games that were already classified"
  where: "games_enriched.xlsx"
  how: "Every column is copied, except the index and the three columns of the old ranking (dervied_rank, total_bets_pct, totatl_bets_cumsum), which are not data of the game."
  joined: "By key = game id normalized + platform_code. game_src_id, then core_desktop_id, then core_mobile_id. The ge_ data of the other game_uid of the same ID fill the empty cells."
- prefix: "sc_"
  source: "Slot Catalog JSON (one file per game)"
  where: "data.zip of the Slot Catalog JSON, folder data/raw"
  how: "Each field of raw_data is cleaned: the page marks [ i ] are removed, lists are written as a, b, c, the Play at the start of the title is removed, and sc_rtp is a number (a value outside 50 to 100 is an error of the page and is left empty)."
  joined: "By the UUID of the Slot Catalog URL file (match by ids), else by name + provider. match_status says how sure the link is."
- prefix: "gm_"
  source: "games matched (Excel)"
  where: "games_matched_final.xlsx, sheets matched, fuzzy_review and unmatched"
  how: "The status, the links and the reason of each game are copied. The attributes (RTP, volatility, bets, max win...) are one clean value per field: the first value found in the order of the file (Slot Catalog, crawler sites, web research), normalized to one format. The texts of third party websites (description, review, pros, cons) are in the catalog; the FAQs are not."
  joined: "By game_uid: each game_uid takes its own row of the file. A game_uid that is not in the file takes the row of its game (another game_uid with the same ID; the best status: matched, then fuzzy, then unmatched)."
- prefix: "names written by hand"
  source: "a short list kept with the catalog"
  where: "platform code / game id and the name"
  how: "Names written on purpose for the sports betting games, which have no name in any source."
  joined: "By platform code / game id, only where no source has a name."
- prefix: "provider list"
  source: "list of provider names kept by hand (rebrands and spellings)"
  where: "standard provider and its other names"
  how: "Maps every spelling of a provider to one standard name (Pragmatic Live Casino gives pragmatic-play), so the same studio always gives the same provider and Provider ID."
  joined: "By the slug of the studio."
