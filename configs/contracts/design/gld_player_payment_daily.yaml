# gld_player_payment_daily: target design of the gold rebuild (2026-09-01), used as the contract of the data checks.
# See configs/contracts/README.md for the fields.
table: gld_player_payment_daily
grain: [tenant_id, brand_id, player_id, event_date, currency, transaction_method]
partition_by: toYYYYMM(event_date)
engine: ReplicatedReplacingMergeTree
columns:
