  - {name: player_id, type: Int32, key: true, group: key}
  - {name: segment_kind, type: LowCardinality(String), key: true, group: key}
  - {name: segment_band, type: LowCardinality(String), group: segment}
  - {name: param_version, type: UInt32, group: computation meta}
  - {name: _version, type: UInt64, group: meta}
  - {name: _ingested_at, type: 'DateTime64(3, ''UTC'')', group: meta}
  - {name: _processed_at, type: 'DateTime64(3, ''UTC'')', group: meta}
