# gld_game: target design of the gold rebuild (2026-09-01), used as the contract of the data checks.
# See configs/contracts/README.md for the fields.
table: gld_game
grain: [tenant_id, brand_id, game_id, platform_id]
partition_by: null
engine: ReplicatedReplacingMergeTree
columns:
