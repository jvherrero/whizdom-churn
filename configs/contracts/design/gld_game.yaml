  - {name: lifetime_real_ggr_eur, type: 'Decimal(18, 4)', group: lifetime cache, unit: currency, additive: true, status: exists}
  - {name: lifetime_bonus_ggr_eur, type: 'Decimal(18, 4)', group: lifetime cache, unit: currency, additive: true, status: exists}
  - {name: lifetime_tax_eur, type: 'Decimal(18, 4)', group: lifetime cache, unit: currency, additive: true, status: exists}
  - {name: lifetime_cashout_eur, type: 'Decimal(18, 4)', group: lifetime cache, unit: currency, additive: true, status: exists}
  - {name: lifetime_rounds, type: UInt64, group: lifetime cache, unit: rounds, additive: true, status: exists}
  - {name: lifetime_bets, type: UInt64, group: lifetime cache, unit: bets, additive: true, status: new}
