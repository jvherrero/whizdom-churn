  - {name: game_id, type: String, key: true, group: key, status: exists}
  - {name: platform_id, type: Int64, key: true, group: key, status: exists}
  - {name: provider_code, type: LowCardinality(String), group: attribute, status: new}
  - {name: name, type: String, group: catalogue, status: exists}
  - {name: provider, type: LowCardinality(String), group: catalogue, status: exists}
  - {name: vertical, type: LowCardinality(String), group: catalogue, status: exists}
  - {name: game_type, type: LowCardinality(String), group: catalogue, status: exists}
  - {name: theme, type: LowCardinality(String), group: catalogue, status: exists}
  - {name: rtp_theoretical, type: Float32, group: catalogue, status: exists}
  - {name: volatility_class, type: LowCardinality(String), group: catalogue, status: exists}
  - {name: status, type: LowCardinality(String), group: lifecycle, status: exists}
  - {name: is_active, type: UInt8, group: lifecycle, status: exists}
  - {name: first_seen, type: 'DateTime64(3, ''UTC'')', group: lifecycle, status: exists}
  - {name: last_seen, type: 'DateTime64(3, ''UTC'')', group: lifecycle, status: exists}
  - {name: lifetime_wagered_eur, type: 'Decimal(18, 4)', group: lifetime cache, unit: currency, additive: true, status: exists}
