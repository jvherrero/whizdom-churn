  - {name: brand_id, type: Int32, key: true, group: key, status: new}
  - {name: game_id, type: String, key: true, group: key, status: exists}
  - {name: platform_id, type: Int64, key: true, group: key, status: exists}
  - {name: event_date, type: Date, key: true, group: key, status: exists}
  - {name: currency, type: LowCardinality(String), key: true, group: key, status: exists}
  - {name: provider_code, type: LowCardinality(String), group: attribute, status: new}
  - {name: rounds, type: UInt64, group: count, unit: rounds, additive: true, status: exists}
  - {name: bets, type: UInt64, group: count, unit: bets, additive: true, status: exists}
  - {name: wins, type: UInt64, group: count, unit: payouts, additive: true, status: exists}
  - {name: winning_rounds, type: UInt64, group: count, unit: rounds, additive: true, status: exists}
  - {name: bet_count_real, type: UInt64, group: count, unit: bets, additive: true, status: exists}
