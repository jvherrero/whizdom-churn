# gld_game_daily: target design of the gold rebuild (2026-09-01), used as the contract of the data checks.
# See configs/contracts/README.md for the fields.
table: gld_game_daily
grain: [tenant_id, brand_id, game_id, platform_id, event_date, currency]
partition_by: toYYYYMM(event_date)
engine: ReplicatedAggregatingMergeTree
columns:
