# gld_game_hourly: target design of the gold rebuild (2026-09-01), used as the contract of the data checks.
# See configs/contracts/README.md for the fields.
table: gld_game_hourly
grain: [tenant_id, brand_id, game_id, platform_id, event_hour]
partition_by: toYYYYMM(event_hour)
engine: ReplicatedAggregatingMergeTree
columns:
  - {name: tenant_id, type: LowCardinality(String), key: true, group: key, status: exists}
  - {name: brand_id, type: Int32, key: true, group: key, status: new}
  - {name: game_id, type: String, key: true, group: key, status: exists}
  - {name: platform_id, type: Int64, key: true, group: key, status: exists}
  - {name: event_hour, type: DateTime, key: true, group: key, status: exists}
  - {name: rounds, type: UInt64, group: count, unit: rounds, additive: true, status: exists}
  - {name: bets, type: UInt64, group: count, unit: bets, additive: true, status: exists}
  - {name: wagered_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: exists}
  - {name: won_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: exists}
  - {name: real_ggr_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: exists}
  - {name: bonus_ggr_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: exists}
  - {name: tax_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: exists}
  - {name: cashout_eur, type: 'Decimal(18, 4)', group: money, unit: currency, additive: true, status: new}
  - {name: players_state, type: 'AggregateFunction(uniqExact, Int32)', group: state, unit: players, additive: false, status: new}
  - {name: _version, type: UInt64, group: meta, status: exists}
  - {name: _processed_at, type: 'DateTime64(3, ''UTC'')', group: meta, status: exists}
