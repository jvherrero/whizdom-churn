# Data alert thresholds (EDA stage 3).
#
# Read by src/features/alerts.py: the pipeline checks the local daily caches after topping them up
# (stage "source") and the feature snapshot before scoring (stage "features"). A critical alert stops
# the pipeline, except feature drift, which is only reported. The same thresholds are reused by the
# drift monitor in Week 2.

version: 2

# Days checked, ending on AS_OF. The benchmark is the days the training features were built from.
current_window_days: 1

# The local daily caches (src/features/daily_cache.py) and the daily totals watched in each: "rows" =
# players with a bet (activity), with money moving (financial) or with a payment (payments) that day.
# valid_from: the cache is only complete from that day (payments: completed deposits from March 2026),
# so the benchmark and the rolling band use the later days only.
tables:
  activity:
    totals: [rows, bets, turnover_eur, ggr_eur]
  financial:
    totals: [rows, wagered_eur, ggr_eur]
  payments:
    totals: [rows, deposit_count, deposit_eur, withdraw_count]
    valid_from: 2026-03-01

expectations:
  severity: critical

null_rate:
  warn_increase_pts: 5
  critical_increase_pts: 20
  min_rows: 100              # Minimum number of rows in the current window to check null rate.

# Rows per day, current vs the benchmark's daily mean.
row_count:
  warn_relative_change: 0.20     # outside +-20%
  critical_relative_change: 0.50 # outside +-50%, or a day with no data at all

# Daily totals vs a rolling band: median of the previous `window_days` days +- n * MAD.
daily_total:
  window_days: 28
  min_periods: 14
  warn_n_mad: 3
  critical_n_mad: 6

# Feature distribution shift, scoring snapshot vs training dataset (Population Stability Index).
# Critical: PSI > 0.25 on one feature, or PSI > 0.10 on critical_n_features or more. Drift never stops
# the run (the delivery plan writes the scores and flags them).
feature_drift:
  bins: 10
  warn_psi: 0.10
  critical_psi: 0.25
  critical_n_features: 5
