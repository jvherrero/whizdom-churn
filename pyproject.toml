[project]
name = "whizdom-churn"
version = "0.1.0"
description = "Player churn prediction: features, LightGBM + Cox PH, backtest and daily scores"
readme = "README.md"
authors = [
    { name = "Javier", email = "javier.herrero@whizdom.ai.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "boto3==1.43.104",
    "clickhouse-connect>=1.11.0",
    "duckdb==1.5.6",
    "fastapi>=0.141.1",
    "feast>=0.66.0",
    "great-expectations>=1.24.0",
    "httpx>=0.28.1",
    "lifelines>=0.30.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=2.3.3",
    "pandera>=0.33.1",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
whizdom-churn = "whizdom_churn:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py313"]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
]
